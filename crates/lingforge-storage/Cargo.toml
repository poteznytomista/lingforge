[package]
name = "lingforge-storage"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
lingforge-core = { path = "../lingforge-core" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "=0.41.1", features = ["bundled", "backup", "limits"] }
uuid = { version = "=1.29.0", features = ["v4"] }
tempfile = "=3.27.0"
fs2 = "=0.4.3"
zip = { version = "=9.3.0", default-features = false, features = ["deflate"] }
csv = "=1.4.0"
