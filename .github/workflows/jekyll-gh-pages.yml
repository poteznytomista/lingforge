name: Publish LingForge website

# Publishing is explicit. This workflow does not build or publish the app itself.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingforge-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify public AppImage and prepare static site
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 website/build.py --repository "$REPOSITORY" --verify-release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
